name: Build OXVOX App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Build Executables with pkg
        run: npm run build

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: OXVOX-Linux
          path: dist/oxvox-linux

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: OXVOX-Windows
          path: dist/oxvox-win.exe

      - name: Upload macOS Binary
        uses: actions/upload-artifact@v4
        with:
          name: OXVOX-macOS
          path: dist/oxvox-macos
